<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <div class="confirm-message" [class.danger]="data.tone === 'danger'">
    <mat-icon [svgIcon]="data.tone === 'danger' ? 'warning' : 'help'"></mat-icon>
    <p>{{ data.message }}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button [color]="data.tone === 'danger' ? 'warn' : 'primary'" (click)="confirmar()">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
