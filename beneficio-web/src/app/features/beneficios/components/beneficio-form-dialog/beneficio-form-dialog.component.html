<h2 mat-dialog-title>{{ data ? 'Editar beneficio' : 'Novo beneficio' }}</h2>

<mat-dialog-content>
  <form class="form" [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" maxlength="100">
      <mat-error>Informe um nome valido.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descricao</mat-label>
      <textarea matInput formControlName="descricao" rows="3" maxlength="255"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="always">
      <mat-label>Valor</mat-label>
      <span matTextPrefix>R$&nbsp;</span>
      <input matInput type="text" inputmode="decimal" formControlName="valorReais" placeholder="0,00" appCurrencyMask>
      <mat-error>Informe um valor igual ou maior que zero.</mat-error>
    </mat-form-field>

    <mat-checkbox formControlName="ativo">Ativo</mat-checkbox>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="salvar()">
    <mat-icon svgIcon="save"></mat-icon>
    Salvar
  </button>
</mat-dialog-actions>
