name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test Java modules
        run: mvn -B clean test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: beneficio-web/package-lock.json
      - name: Install dependencies
        working-directory: beneficio-web
        run: npm ci
      - name: Test
        working-directory: beneficio-web
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build
        working-directory: beneficio-web
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start stack
        run: docker compose up --build -d
      - name: Smoke test
        run: bash scripts/smoke-test.sh
      - name: Concurrency test
        run: bash scripts/concurrency-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
